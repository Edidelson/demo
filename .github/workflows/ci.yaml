name: integracao_ci_demo
on:
  pull_request:
    branches:
      - master
jobs:
  check-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Construir aplicação com Maven
        run: mvn clean package

      - name: Executar testes
        run: mvn test